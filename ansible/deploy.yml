---
- name: Desplegar MVP EDA con Docker Compose
  hosts: demo
  become: true
  gather_facts: true

  tasks:
    - name: Validar sistema operativo soportado
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: "Este playbook esta preparado para Ubuntu/Debian. Para Windows o Red Hat hay que adaptar la instalacion de Docker."

    - name: Instalar paquetes base
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - python3
          - python3-pip
        state: present
        update_cache: true

    - name: Instalar Docker y plugin Compose desde repositorio del sistema
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-plugin
        state: present

    - name: Asegurar que Docker este activo
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Crear directorio destino
      ansible.builtin.file:
        path: "{{ deploy_path }}"
        state: directory
        owner: "{{ ansible_user | default(ansible_ssh_user) }}"
        group: "{{ ansible_user | default(ansible_ssh_user) }}"
        mode: "0755"

    - name: Copiar proyecto al servidor
      ansible.builtin.synchronize:
        src: "{{ project_src }}/"
        dest: "{{ deploy_path }}/"
        delete: true
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=ansible/.retry"

    - name: Aplicar puerto publico de MySQL configurable
      ansible.builtin.replace:
        path: "{{ deploy_path }}/docker-compose.yml"
        regexp: '"3307:3306"'
        replace: '"{{ mysql_public_port }}:3306"'

    - name: Construir y levantar servicios
      ansible.builtin.command: docker compose -p "{{ compose_project_name }}" up -d --build
      args:
        chdir: "{{ deploy_path }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stdout or 'Recreated' in compose_up.stdout or 'Built' in compose_up.stdout or 'Created' in compose_up.stdout"

    - name: Mostrar estado de contenedores
      ansible.builtin.command: docker compose -p "{{ compose_project_name }}" ps
      args:
        chdir: "{{ deploy_path }}"
      register: compose_ps
      changed_when: false

    - name: Imprimir estado
      ansible.builtin.debug:
        var: compose_ps.stdout_lines

    - name: Esperar UI de Asistencia
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ asistencia_port }}"
        status_code: 200
      register: asistencia_check
      retries: 12
      delay: 5
      until: asistencia_check.status == 200

    - name: Esperar UI de Pagos
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ pagos_port }}"
        status_code: 200
      register: pagos_check
      retries: 12
      delay: 5
      until: pagos_check.status == 200

    - name: Esperar UI de Panel
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ panel_port }}"
        status_code: 200
      register: panel_check
      retries: 12
      delay: 5
      until: panel_check.status == 200

    - name: URLs de la demo
      ansible.builtin.debug:
        msg:
          - "Asistencia: http://{{ ansible_host | default(inventory_hostname) }}:{{ asistencia_port }}"
          - "Pagos: http://{{ ansible_host | default(inventory_hostname) }}:{{ pagos_port }}"
          - "Panel: http://{{ ansible_host | default(inventory_hostname) }}:{{ panel_port }}"
          - "RabbitMQ: http://{{ ansible_host | default(inventory_hostname) }}:{{ rabbitmq_ui_port }}"
