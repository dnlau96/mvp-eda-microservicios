[demo]
# Reemplaza la IP publica y la ruta de la llave .pem por los datos de tu EC2.
# En Ubuntu Server para EC2 el usuario por defecto normalmente es "ubuntu".
EC2_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/mvp-eda-demo.pem

[demo:vars]
ansible_python_interpreter=/usr/bin/python3
